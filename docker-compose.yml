version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: kkp_postgres
    restart: always
    environment:
      POSTGRES_USER: kkp_user
      POSTGRES_PASSWORD: kkp_password
      POSTGRES_DB: kkp_transformation_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kkp_backend
    restart: always
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - DATABASE_URL=postgres://kkp_user:kkp_password@postgres:5432/kkp_transformation_db?sslmode=disable
    depends_on:
      - postgres

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kkp_frontend
    restart: always
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://localhost:8080
    depends_on:
      - backend

volumes:
  postgres_data:
